# PV + PVC for lib/helm-chart-openebs-persistence.
# Create the host dir first, on node pi: sudo mkdir -p /homelab/drives/drive-2tb-1/app-data/paperless-ngx
storage: 50Gi
storageClassName: openebs-hostpath
pv:
  enabled: true
  name: pv-homelab-app-data-paperless-ngx
  path: /homelab/drives/drive-2tb-1/app-data/paperless-ngx
  accessModes:
    - ReadWriteMany
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - pi
pvc:
  enabled: true
  name: pvc-homelab-app-data-paperless-ngx
