# All secrets for this repo, in one place.
#   cp secrets.example.yaml secrets.yaml   # secrets.yaml is gitignored, never commit it
#   ./env-substituter.sh path/to/values.yaml   # writes values.local.yaml
#   ./env-substituter.sh --check               # every {secret:NAME} in the repo is listed here
#
# Each key matches a {secret:NAME} placeholder. Find where one is used:
#   git grep -n '{secret:KEYCLOAK__DB_PASSWORD}'
# Format: flat `NAME: value`. Quote values with spaces or a leading #. No escape sequences.
# Values are pasted inside "..." in the YAML, so avoid `"` and `\` in them.

# cert-manager: Cloudflare API token (cert-issuers/cloudflare-apikey.yaml)
ISSUER__SECRET: ""

IMMICH__DB_PASSWORD: ""
